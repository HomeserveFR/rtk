name: SonarQube

on:
  push:
    branches: [homeserve/main]
  pull_request:
    branches: [homeserve/main]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The two isolation tests assert that a child of an isolated rtk inherits
      # nothing from this process's environment. Under llvm-cov the instrumented
      # rtk sets __LLVM_PROFILE_RT_INIT_ONCE itself, which they read as a leak.
      # They run uninstrumented, and must pass, in ci.yml's test jobs.
      - name: Generate coverage report (LCOV)
        run: >-
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --no-fail-fast
          -- --skip a_tool_rtk_runs_inherits_nothing_isolation_drops
          --skip an_rtk_command_isolated_for_git_keeps_its_data_pinned

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: https://sonarqube-prod.homeserve.io
